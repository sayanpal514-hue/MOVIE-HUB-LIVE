<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportlink Movie Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: rgba(31, 40, 51, 0.6);
            --primary-color: #66fcf1;
            --secondary-color: #45a29e;
            --text-main: #c5c6c7;
            --text-light: #ffffff;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(69, 162, 158, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(102, 252, 241, 0.15), transparent 25%);
        }

        header {
            padding: 2rem;
            text-align: center;
            background: linear-gradient(180deg, rgba(11, 12, 16, 0.9) 0%, rgba(11, 12, 16, 0) 100%);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        h1 {
            color: var(--text-light);
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(102, 252, 241, 0.2); }
            to { text-shadow: 0 0 20px rgba(102, 252, 241, 0.6), 0 0 30px rgba(102, 252, 241, 0.4); }
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title::after {
            content: '';
            height: 2px;
            flex-grow: 1;
            background: linear-gradient(90deg, var(--primary-color), transparent);
            opacity: 0.5;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .movie-card {
            background: var(--surface-color);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--primary-color);
            box-shadow: 0 20px 40px rgba(102, 252, 241, 0.2);
        }

        .movie-poster-container {
            position: relative;
            width: 100%;
            padding-top: 150%; /* 2:3 Aspect Ratio */
            overflow: hidden;
        }

        .movie-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.1);
        }

        .rating-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            color: #ffd700;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            z-index: 10;
        }

        .movie-info {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to top, rgba(11, 12, 16, 1) 0%, rgba(31, 40, 51, 0) 100%);
        }

        .movie-title {
            color: var(--text-light);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }

        .movie-overview {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .watch-btn {
            margin-top: auto;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--secondary-color), var(--primary-color));
            color: var(--bg-color);
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .watch-btn:hover {
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
            transform: scale(1.05);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.95);
            z-index: 1000;
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            width: 90%;
            max-width: 1200px;
            height: 80vh;
            background: var(--surface-color);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid var(--glass-border);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            transform: rotate(90deg);
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loader {
            border: 4px solid var(--surface-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 100px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            color: #ff6b6b;
            padding: 2rem;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sportlink Movie Hub</h1>
    </header>

    <main>
        <div id="loading" class="loader"></div>
        <div id="content" style="display: none;">
            <h2 class="section-title">Spotlight</h2>
            <div id="spotlight-grid" class="movie-grid"></div>

            <h2 class="section-title">Trending</h2>
            <div id="trending-grid" class="movie-grid"></div>
        </div>
    </main>

    <div id="player-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <div class="iframe-container" id="iframe-container"></div>
        </div>
    </div>

    <script>
        const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';
        
        // Attempt to fetch from movie.json first, if not found fallback to home.json
        async function fetchData() {
            try {
                // Since the file is actually home.json in the directory, let's fetch that
                const response = await fetch('movie.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const json = await response.json();
                
                if (json.success && json.data) {
                    renderMovies(json.data.spotlight, 'spotlight-grid');
                    renderMovies(json.data.trending, 'trending-grid');
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                }
            } catch (error) {
                console.error("Could not fetch data:", error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').innerHTML = `
                    <div class="error-message">
                        Failed to load movie data. Please make sure home.json or movie.json exists.
                        <br><br>
                        Error: ${error.message}
                    </div>
                `;
                document.getElementById('content').style.display = 'block';
            }
        }

        function renderMovies(movies, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            movies.forEach(movie => {
                const posterUrl = movie.poster ? `${TMDB_IMAGE_BASE}${movie.poster}` : 'https://via.placeholder.com/500x750?text=No+Poster';
                
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="movie-poster-container">
                        <img src="${posterUrl}" alt="${movie.title}" class="movie-poster" loading="lazy">
                        <div class="rating-badge">★ ${movie.rating.toFixed(1)}</div>
                    </div>
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span style="text-transform: uppercase;">${movie.type}</span>
                        </div>
                        <p class="movie-overview">${movie.overview}</p>
                        <button class="watch-btn" onclick="openPlayer('${movie.iframe}')">Watch Now</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Modal Logic
        const modal = document.getElementById('player-modal');
        const iframeContainer = document.getElementById('iframe-container');
        const closeBtn = document.getElementById('close-modal');

        window.openPlayer = function(iframeUrl) {
            iframeContainer.innerHTML = `<iframe src="${iframeUrl}" allowfullscreen allow="autoplay"></iframe>`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        };

        function closeModal() {
            modal.classList.remove('active');
            setTimeout(() => {
                iframeContainer.innerHTML = ''; // Clear iframe to stop video
            }, 300); // Wait for transition
            document.body.style.overflow = 'auto';
        }

        closeBtn.addEventListener('click', closeModal);

        // Close on outside click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // Init
        fetchData();
    </script>
</body>
</html>
