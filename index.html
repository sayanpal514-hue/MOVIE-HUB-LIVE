<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportlink Movie Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: rgba(31, 40, 51, 0.6);
            --primary-color: #66fcf1;
            --secondary-color: #45a29e;
            --text-main: #c5c6c7;
            --text-light: #ffffff;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(69, 162, 158, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(102, 252, 241, 0.15), transparent 25%);
        }

        header {
            padding: 2rem;
            text-align: center;
            background: linear-gradient(180deg, rgba(11, 12, 16, 0.9) 0%, rgba(11, 12, 16, 0) 100%);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        h1 {
            color: var(--text-light);
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(102, 252, 241, 0.2); }
            to { text-shadow: 0 0 20px rgba(102, 252, 241, 0.6), 0 0 30px rgba(102, 252, 241, 0.4); }
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title::after {
            content: '';
            height: 2px;
            flex-grow: 1;
            background: linear-gradient(90deg, var(--primary-color), transparent);
            opacity: 0.5;
        }

        /* Search bar */
        .search-container {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        #search-input {
            width: 100%;
            max-width: 600px;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: rgba(31, 40, 51, 0.6);
            backdrop-filter: blur(10px);
            color: var(--text-light);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        #search-input::placeholder {
            color: rgba(197, 198, 199, 0.6);
        }

        #search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .movie-card {
            background: var(--surface-color);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--primary-color);
            box-shadow: 0 20px 40px rgba(102, 252, 241, 0.2);
        }

        .movie-poster-container {
            position: relative;
            width: 100%;
            padding-top: 150%;
            overflow: hidden;
        }

        .movie-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.1);
        }

        .rating-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            color: #ffd700;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            z-index: 10;
        }

        .movie-info {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to top, rgba(11, 12, 16, 1) 0%, rgba(31, 40, 51, 0) 100%);
        }

        .movie-title {
            color: var(--text-light);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }

        .movie-overview {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .watch-btn {
            margin-top: auto;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--secondary-color), var(--primary-color));
            color: var(--bg-color);
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .watch-btn:hover {
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
            transform: scale(1.05);
        }

        .no-results {
            text-align: center;
            color: var(--text-main);
            font-size: 1.2rem;
            padding: 2rem;
            grid-column: 1 / -1;
        }

        /* ===== Fullscreen Player Modal ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
            transform: scale(1.03);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .player-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0) 100%);
            z-index: 20;
            opacity: 1;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .player-topbar > * {
            pointer-events: auto;
        }

        .modal.dim-controls .player-topbar {
            opacity: 0;
        }

        .now-playing-title {
            color: var(--text-light);
            font-weight: 600;
            font-size: 1.1rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            max-width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-actions {
            display: flex;
            gap: 0.75rem;
        }

        .close-modal,
        .fullscreen-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(20, 22, 26, 0.6);
            color: white;
            border: 1px solid var(--glass-border);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .close-modal:hover {
            background: #ff4d4d;
            border-color: #ff4d4d;
            transform: rotate(90deg);
        }

        .fullscreen-toggle:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            border-color: var(--primary-color);
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .player-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            animation: spin 1s linear infinite;
            z-index: 5;
        }

        .loader {
            border: 4px solid var(--surface-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 100px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            color: #ff6b6b;
            padding: 2rem;
            font-size: 1.2rem;
        }

        @media (max-width: 640px) {
            .now-playing-title { font-size: 0.95rem; max-width: 55%; }
            .close-modal, .fullscreen-toggle { width: 38px; height: 38px; font-size: 1.2rem; }
            #search-input { font-size: 1rem; padding: 0.8rem 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Sportlink Movie Hub</h1>
    </header>

    <main>
        <div id="loading" class="loader"></div>
        <div id="content" style="display: none;">
            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search movies, TV shows, anime..." autocomplete="off">
            </div>

            <!-- All sections -->
            <h2 class="section-title">Spotlight</h2>
            <div id="spotlight-grid" class="movie-grid"></div>

            <h2 class="section-title">Trending</h2>
            <div id="trending-grid" class="movie-grid"></div>

            <h2 class="section-title">Popular Movies</h2>
            <div id="popular-grid" class="movie-grid"></div>

            <h2 class="section-title">Top Movies</h2>
            <div id="top-grid" class="movie-grid"></div>

            <h2 class="section-title">Now Playing</h2>
            <div id="now-playing-grid" class="movie-grid"></div>

            <h2 class="section-title">All Movies (Combined)</h2>
            <div id="all-movies-grid" class="movie-grid"></div>
        </div>
    </main>

    <div id="player-modal" class="modal">
        <div class="modal-content" id="modal-content">
            <div class="player-topbar">
                <span class="now-playing-title" id="now-playing-title"></span>
                <div class="player-actions">
                    <button class="fullscreen-toggle" id="fullscreen-toggle" title="Toggle fullscreen">⛶</button>
                    <button class="close-modal" id="close-modal" title="Close">&times;</button>
                </div>
            </div>
            <div class="iframe-container" id="iframe-container">
                <div class="player-loader" id="player-loader"></div>
            </div>
        </div>
    </div>

    <script>
        const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';

        async function fetchData() {
            try {
                const response = await fetch('https://movie-hub-s10.vercel.app/movie.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const json = await response.json();

                if (json.success && json.data) {
                    // Render each section
                    renderMovies(json.data.spotlight, 'spotlight-grid');
                    renderMovies(json.data.trending, 'trending-grid');
                    renderMovies(json.data.popularMovies, 'popular-grid');
                    renderMovies(json.data.topMovies, 'top-grid');
                    renderMovies(json.data.nowPlaying, 'now-playing-grid');

                    // Build combined unique list
                    const allSections = [
                        json.data.spotlight,
                        json.data.trending,
                        json.data.popularMovies,
                        json.data.topMovies,
                        json.data.nowPlaying
                    ];
                    const allMovies = [];
                    const seen = new Set();
                    allSections.forEach(section => {
                        if (Array.isArray(section)) {
                            section.forEach(movie => {
                                if (!seen.has(movie.id)) {
                                    seen.add(movie.id);
                                    allMovies.push(movie);
                                }
                            });
                        }
                    });
                    renderMovies(allMovies, 'all-movies-grid');

                    // Global search: filter every card in every grid
                    const searchInput = document.getElementById('search-input');
                    searchInput.addEventListener('input', function(e) {
                        const query = e.target.value.trim().toLowerCase();
                        // Get all movie cards across all grids
                        const allCards = document.querySelectorAll('.movie-card');
                        allCards.forEach(card => {
                            const title = (card.dataset.title || '').toLowerCase();
                            const type = (card.dataset.type || '').toLowerCase();
                            const year = (card.dataset.year || '').toLowerCase();
                            const match = title.includes(query) || type.includes(query) || year.includes(query);
                            card.style.display = match ? '' : 'none';
                        });

                        // Optionally show "no results" in each grid? We'll rely on the combined grid, but we can add per-grid no-results if needed.
                        // Instead, we'll leave it as is; if all cards in a grid are hidden, the grid will appear empty.
                    });

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                }
            } catch (error) {
                console.error("Could not fetch data:", error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').innerHTML = `
                    <div class="error-message">
                        Failed to load movie data. Please check your internet connection or try again later.
                        <br><br>
                        Error: ${error.message}
                    </div>
                `;
                document.getElementById('content').style.display = 'block';
            }
        }

        function renderMovies(movies, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (!movies || movies.length === 0) {
                container.innerHTML = `<div class="no-results">No titles available.</div>`;
                return;
            }

            movies.forEach(movie => {
                const posterUrl = movie.poster ? `${TMDB_IMAGE_BASE}${movie.poster}` : 'https://via.placeholder.com/500x750?text=No+Poster';
                const card = document.createElement('div');
                card.className = 'movie-card';
                // Store searchable data
                card.dataset.title = (movie.title || '').toLowerCase();
                card.dataset.type = (movie.type || '').toLowerCase();
                card.dataset.year = (movie.year || '').toLowerCase();
                card.innerHTML = `
                    <div class="movie-poster-container">
                        <img src="${posterUrl}" alt="${movie.title}" class="movie-poster" loading="lazy">
                        <div class="rating-badge">★ ${movie.rating.toFixed(1)}</div>
                    </div>
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span style="text-transform: uppercase;">${movie.type}</span>
                        </div>
                        <p class="movie-overview">${movie.overview}</p>
                        <button class="watch-btn" onclick="openPlayer('${movie.iframe}', '${movie.title.replace(/'/g, "\\'")}')">Watch Now</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- Modal / Fullscreen Logic (unchanged) ---
        const modal = document.getElementById('player-modal');
        const modalContent = document.getElementById('modal-content');
        const iframeContainer = document.getElementById('iframe-container');
        const closeBtn = document.getElementById('close-modal');
        const fullscreenBtn = document.getElementById('fullscreen-toggle');
        const nowPlayingTitle = document.getElementById('now-playing-title');
        const playerLoader = document.getElementById('player-loader');

        let dimTimer = null;

        function requestFS(el) {
            const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
            if (fn) return fn.call(el).catch(() => {});
        }

        function exitFS() {
            const fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
            if (fn && (document.fullscreenElement || document.webkitFullscreenElement)) {
                return fn.call(document).catch(() => {});
            }
        }

        function scheduleDim() {
            clearTimeout(dimTimer);
            modal.classList.remove('dim-controls');
            dimTimer = setTimeout(() => modal.classList.add('dim-controls'), 3000);
        }

        window.openPlayer = function(iframeUrl, title) {
            nowPlayingTitle.textContent = title || '';
            iframeContainer.innerHTML = '';
            iframeContainer.appendChild(playerLoader);
            playerLoader.style.display = 'block';

            const iframe = document.createElement('iframe');
            iframe.src = iframeUrl;
            iframe.allowFullscreen = true;
            iframe.setAttribute('allow', 'autoplay; fullscreen');
            iframe.onload = () => { playerLoader.style.display = 'none'; };
            iframeContainer.appendChild(iframe);

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            requestFS(modalContent);
            scheduleDim();
        };

        function closeModal() {
            modal.classList.remove('active', 'dim-controls');
            clearTimeout(dimTimer);
            exitFS();
            setTimeout(() => {
                iframeContainer.innerHTML = '';
                iframeContainer.appendChild(playerLoader);
            }, 300);
            document.body.style.overflow = 'auto';
        }

        closeBtn.addEventListener('click', closeModal);
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                exitFS();
            } else {
                requestFS(modalContent);
            }
        });

        modal.addEventListener('mousemove', scheduleDim);
        modal.addEventListener('touchstart', scheduleDim);

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && modal.classList.contains('active')) {
                scheduleDim();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active') && !document.fullscreenElement) {
                closeModal();
            }
        });

        // Init
        fetchData();
    </script>
</body>
</html>
