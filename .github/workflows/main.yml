name: Update Home API

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node scripts/update.js

      - run: |
          git config --global user.name "sayanpal514-hue"
          git config --global user.email "223531683+sayanpal514-hue@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update JSON"
          git push
